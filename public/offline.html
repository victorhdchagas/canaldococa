<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canal do Coca - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 2rem;
      border: 4px solid #ef4444;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #cccccc;
    }
    .retry-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .retry-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/coca_head.png" alt="Canal do Coca" class="logo">
    <h1>Você está offline</h1>
    <p>Ops! Parece que você perdeu a conexão com a internet. Mas não se preocupe, você ainda pode acessar alguns conteúdos que foram salvos no seu navegador.</p>
    <button class="retry-btn" onclick="window.location.reload()">Tentar Novamente</button>
  </div>
</body>
</html>
